version: '3.8'

services:
  web:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_HOST=localhost

  database:
    image: postgres:15-alpine
    user: root
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=supersecret